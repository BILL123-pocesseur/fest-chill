<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Découvre tous les événements en vente sur Fest&Chill par catégorie et achète ton ticket en quelques secondes.">
<meta name="theme-color" content="#FFFBF3">
<meta property="og:title" content="Événements — Fest&Chill">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎟️</text></svg>">
<title>Événements — Fest&Chill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#FFFBF3;--paper2:#FFF4E1;--ink:#241C14;--muted:#8A7A68;
  --red:#E8432E;--red-deep:#C4321F;--yellow:#FFC53D;--green:#1E8A5F;--line:#EBDFC9;
  --fs:'Instrument Serif',serif;--fb:'Plus Jakarta Sans',sans-serif;
}
body{font-family:var(--fb);background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

nav{padding:18px 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(255,251,243,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50}
.logo{font-family:var(--fs);font-style:italic;font-weight:400;font-size:1.4rem;color:var(--ink)}
.logo em{color:var(--red);font-style:normal}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:100px;font-size:.83rem;font-weight:700;cursor:pointer;font-family:var(--fb);border:1.5px solid var(--ink);background:transparent;color:var(--ink);transition:all .2s}
.btn:hover{background:var(--ink);color:var(--paper)}

header.page-head{padding:52px 6% 22px;text-align:center}
h1{font-family:var(--fs);font-weight:400;font-size:clamp(2rem,5vw,2.9rem);letter-spacing:-.01em;margin-bottom:10px}
h1 i{font-style:italic;color:var(--red-deep)}
.page-sub{color:var(--muted);font-size:.96rem;font-weight:500}

.filters{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;padding:28px 6%;max-width:1100px;margin:0 auto}
.chip{padding:9px 17px;border-radius:100px;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;padding:14px 6% 90px;max-width:1200px;margin:0 auto}

.ev-card{background:#fff;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s;display:flex;flex-direction:column}
.ev-card:hover{transform:translateY(-5px);box-shadow:7px 9px 0 var(--yellow)}
.ev-card:nth-child(3n+2):hover{box-shadow:7px 9px 0 var(--red)}
.ev-card:nth-child(3n)::hover{box-shadow:7px 9px 0 var(--green)}
.ev-banner{height:104px;background:var(--paper2);border-bottom:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:2rem;position:relative;overflow:hidden}
.ev-photo-credit{position:absolute;bottom:4px;right:6px;font-size:.62rem;color:rgba(255,255,255,.85);background:rgba(0,0,0,.35);padding:2px 6px;border-radius:100px;text-decoration:none;z-index:2}
.ev-photo-credit:hover{color:#fff}
.ev-type-badge{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--paper);font-size:.66rem;font-weight:700;padding:5px 10px;border-radius:100px}
.ev-urgent-badge{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-size:.62rem;font-weight:800;padding:5px 10px;border-radius:100px;animation:pulseUrgent 1.6s ease-in-out infinite}
@keyframes pulseUrgent{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.ev-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.ev-title{font-family:var(--fs);font-weight:400;font-size:1.25rem;line-height:1.3}
.ev-meta{font-size:.79rem;color:var(--muted);display:flex;flex-direction:column;gap:3px;font-weight:500}
.ev-organizer{font-size:.75rem;color:var(--muted);margin-top:2px;font-weight:500}
.ev-footer{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line)}
.ev-price{font-family:var(--fs);font-weight:400;color:var(--red-deep);font-size:1.1rem}
.ev-cta{font-size:.78rem;font-weight:700}

.state-msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px;font-size:.9rem}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<nav>
  <a href="festchill-welcome.html" class="logo">Fest<em>&</em>Chill</a>
  <a href="festchill-landing.html" class="btn">Espace organisateur</a>
</nav>

<header class="page-head">
  <h1 id="page-title">Trouve ton <i>prochain événement</i></h1>
  <div class="page-sub" id="page-sub">Tous les événements en vente sur Fest&Chill, par tous les organisateurs.</div>
  <button class="btn" id="history-toggle" style="margin-top:16px" onclick="toggleHistory()">🕐 Voir les événements passés</button>
</header>

<div class="filters" id="filters"></div>
<div class="grid" id="grid">
  <div class="state-msg">Chargement des événements...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script>
let allEvents = [];
let currentType = 'all';
let showingHistory = false;

const TYPE_ICON = {
  'Concert / Musique': '🎵','Conférence': '🎤','Soirée / Club': '🎉','Sport': '⚽','Théâtre / Art': '✨','Autre': '✨',
};

async function toggleHistory(){
  showingHistory = !showingHistory;
  document.getElementById('page-title').innerHTML = showingHistory ? 'Historique des <i>événements passés</i>' : 'Trouve ton <i>prochain événement</i>';
  document.getElementById('page-sub').textContent = showingHistory ? 'Les événements déjà terminés sur Fest&Chill.' : 'Tous les événements en vente sur Fest&Chill, par tous les organisateurs.';
  document.getElementById('history-toggle').textContent = showingHistory ? '← Retour aux événements à venir' : '🕐 Voir les événements passés';
  document.getElementById('grid').innerHTML = '<div class="state-msg">Chargement...</div>';
  await boot();
}

async function boot(){
  const today = new Date().toISOString().slice(0,10);
  let q = supa
    .from('events')
    .select('id, slug, title, event_type, location, event_date, event_time, organizer_id, ticket_categories(price,quota,sold), profiles(full_name,certified)')
    .eq('status', 'published');

  q = showingHistory
    ? q.lt('event_date', today).order('event_date', { ascending: false })
    : q.gte('event_date', today).order('event_date', { ascending: true });

  const { data, error } = await q;

  if (error){
    document.getElementById('grid').innerHTML = '<div class="state-msg">Impossible de charger les événements pour le moment. Réessaie dans un instant.</div>';
    return;
  }
  allEvents = data || [];
  renderFilters();
  render();
}

function renderFilters(){
  const types = ['all', ...new Set(allEvents.map(e => e.event_type).filter(Boolean))];
  const el = document.getElementById('filters');
  el.innerHTML = types.map(t => `<div class="chip${t===currentType?' active':''}" data-type="${t}">${t==='all' ? '🎫 Tous' : (TYPE_ICON[t]||'✨') + ' ' + t}</div>`).join('');
  el.querySelectorAll('.chip').forEach(c => c.onclick = () => { currentType = c.dataset.type; renderFilters(); render(); });
}

function render(){
  const grid = document.getElementById('grid');
  const list = currentType === 'all' ? allEvents : allEvents.filter(e => e.event_type === currentType);
  if (!list.length){
    grid.innerHTML = '<div class="state-msg">Aucun événement disponible dans cette catégorie pour le moment.</div>';
    return;
  }
  grid.innerHTML = list.map(e => {
    const prices = (e.ticket_categories||[]).map(c=>c.price).filter(p=>p!=null);
    const minPrice = prices.length ? Math.min(...prices) : null;
    const organizerName = e.profiles?.full_name || 'Organisateur Fest&Chill';
    const totalQuota = (e.ticket_categories||[]).reduce((s,c)=>s+(c.quota||0),0);
    const totalSold = (e.ticket_categories||[]).reduce((s,c)=>s+(c.sold||0),0);
    const remaining = totalQuota - totalSold;
    const lowStock = totalQuota > 0 && totalQuota < 999999 && remaining > 0 && remaining <= Math.max(10, totalQuota*0.15);
    return `<a class="ev-card" href="festchill-buy-ticket.html?event=${e.slug}">
      <div class="ev-banner" data-cat="${e.event_type || 'Autre'}">
        <span class="ev-type-badge">${e.event_type || 'Événement'}</span>
        ${lowStock ? `<span class="ev-urgent-badge">🔥 Plus que ${remaining} places</span>` : ''}
        <span class="ev-banner-icon">${TYPE_ICON[e.event_type] || '🎫'}</span>
      </div>
      <div class="ev-body">
        <div class="ev-title">${e.title}</div>
        <div class="ev-meta">
          <span>📅 ${fcFormatDate(e.event_date, {day:'numeric',month:'short',year:'numeric'})}${e.event_time ? ' · ' + e.event_time : ''}</span>
          <span>📍 ${e.location || 'Lieu à confirmer'}</span>
        </div>
        <div class="ev-organizer">Par ${organizerName}${e.profiles?.certified ? ' <span title="Organisateur certifié" style="color:var(--green)">✅</span>' : ''}</div>
        <div class="ev-footer">
          <span class="ev-price">${minPrice!=null ? 'Dès ' + minPrice.toLocaleString('fr-FR') + ' F' : 'Prix à venir'}</span>
          <span class="ev-cta">Voir →</span>
        </div>
      </div>
    </a>`;
  }).join('');

  loadCategoryPhotos(list);
}

// Charge une vraie photo par catégorie (une seule requête par catégorie
// distincte affichée, pas une par carte) et l'applique en fond.
async function loadCategoryPhotos(list){
  const distinctTypes = [...new Set(list.map(e => e.event_type || 'Autre'))];
  for (const type of distinctTypes){
    const photo = await fcGetCategoryPhoto(type);
    if (!photo) continue;
    document.querySelectorAll(`.ev-banner[data-cat="${CSS.escape(type)}"]`).forEach(banner => {
      banner.style.backgroundImage = `linear-gradient(rgba(36,28,20,.15),rgba(36,28,20,.35)), url('${photo.thumb_url}')`;
      banner.style.backgroundSize = 'cover';
      banner.style.backgroundPosition = 'center';
      banner.querySelector('.ev-banner-icon').style.display = 'none';
      const credit = document.createElement('a');
      credit.href = photo.photographer_url;
      credit.target = '_blank';
      credit.rel = 'noopener';
      credit.className = 'ev-photo-credit';
      credit.textContent = 'Photo : ' + photo.photographer_name;
      credit.onclick = (ev) => ev.stopPropagation();
      banner.appendChild(credit);
    });
  }
}

boot();
</script>
<footer style="text-align:center;padding:28px 6%;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border,rgba(0,0,0,.08))">© 2026 Fest&Chill · <a href="festchill-privacy.html" style="color:inherit">Confidentialité</a> · <a href="festchill-terms.html" style="color:inherit">CGU</a></footer>
</body>
</html>
