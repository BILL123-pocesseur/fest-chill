<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Événements — Fest&Chill</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#071619;--deep:#0D2126;--surface:#123037;
  --purple:#0EA5A0;--violet:#0B7A76;--glow:#5EEAD4;
  --gold:#FF8A3D;--green:#34D399;--red:#FF5A5F;
  --white:#F7FBFA;--muted:#7C9A9A;--text:#DCEEEC;
  --card:rgba(14,165,160,.08);--border:rgba(94,234,212,.14);
  --fd:'Bricolage Grotesque',sans-serif;--fb:'Manrope',sans-serif;
  --r:14px;
}
body{font-family:var(--fb);background:var(--ink);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}

nav{padding:16px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(7,22,25,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
.logo{font-family:var(--fd);font-weight:800;font-size:1.25rem;color:var(--white)}
.logo span{color:var(--glow)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:9px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:var(--fb);border:1px solid var(--border);background:transparent;color:var(--text);transition:all .2s}
.btn:hover{border-color:var(--glow);color:var(--white)}

header.page-head{padding:44px 5% 20px;text-align:center}
h1{font-family:var(--fd);font-weight:800;font-size:clamp(1.8rem,4.5vw,2.6rem);letter-spacing:-.02em;margin-bottom:8px}
h1 .accent{color:var(--glow)}
.page-sub{color:var(--muted);font-size:.95rem}

.filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:26px 5%;max-width:1100px;margin:0 auto}
.chip{padding:9px 18px;border-radius:100px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.chip:hover{border-color:var(--glow);color:var(--text)}
.chip.active{background:var(--purple);border-color:var(--purple);color:var(--white)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:10px 5% 80px;max-width:1200px;margin:0 auto}

.ev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s,border-color .3s;display:flex;flex-direction:column}
.ev-card:hover{transform:translateY(-5px);box-shadow:0 18px 36px rgba(14,165,160,.16);border-color:rgba(94,234,212,.4)}
.ev-banner{height:110px;background:linear-gradient(135deg,var(--purple),var(--violet));display:flex;align-items:center;justify-content:center;font-size:2.2rem;position:relative}
.ev-type-badge{position:absolute;top:10px;left:10px;background:rgba(7,22,25,.55);backdrop-filter:blur(6px);color:var(--white);font-size:.68rem;font-weight:700;padding:5px 10px;border-radius:100px}
.ev-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.ev-title{font-family:var(--fd);font-weight:700;font-size:1.05rem;line-height:1.3}
.ev-meta{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.ev-organizer{font-size:.74rem;color:var(--muted);margin-top:2px}
.ev-footer{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center}
.ev-price{font-family:var(--fd);font-weight:800;color:var(--gold);font-size:.95rem}
.ev-cta{font-size:.78rem;font-weight:700;color:var(--glow)}

.state-msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px;font-size:.9rem}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<nav>
  <a href="festchill-welcome.html" class="logo">Fest<span>&</span>Chill</a>
  <a href="festchill-landing.html" class="btn">Espace organisateur</a>
</nav>

<header class="page-head">
  <h1>Trouve ton <span class="accent">prochain événement</span></h1>
  <div class="page-sub">Tous les événements en vente sur Fest&Chill, par tous les organisateurs.</div>
</header>

<div class="filters" id="filters"></div>
<div class="grid" id="grid">
  <div class="state-msg">Chargement des événements...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script>
let allEvents = [];
let currentType = 'all';

const TYPE_ICON = {
  'Concert / Musique': '🎵',
  'Conférence': '🎤',
  'Soirée / Club': '🎉',
  'Sport': '⚽',
  'Théâtre / Art': '🎭',
  'Autre': '✨',
};

async function boot(){
  const { data, error } = await supa
    .from('events')
    .select('id, slug, title, event_type, location, event_date, event_time, organizer_id, ticket_categories(price), profiles(full_name)')
    .eq('status', 'published')
    .order('event_date', { ascending: true });

  if (error){
    document.getElementById('grid').innerHTML = '<div class="state-msg">Impossible de charger les événements pour le moment. Réessaie dans un instant.</div>';
    return;
  }

  allEvents = data || [];
  renderFilters();
  render();
}

function renderFilters(){
  const types = ['all', ...new Set(allEvents.map(e => e.event_type).filter(Boolean))];
  const el = document.getElementById('filters');
  el.innerHTML = types.map(t => `<div class="chip${t===currentType?' active':''}" data-type="${t}">${t==='all' ? '🎫 Tous' : (TYPE_ICON[t]||'✨') + ' ' + t}</div>`).join('');
  el.querySelectorAll('.chip').forEach(c => c.onclick = () => { currentType = c.dataset.type; renderFilters(); render(); });
}

function render(){
  const grid = document.getElementById('grid');
  const list = currentType === 'all' ? allEvents : allEvents.filter(e => e.event_type === currentType);

  if (!list.length){
    grid.innerHTML = '<div class="state-msg">Aucun événement disponible dans cette catégorie pour le moment.</div>';
    return;
  }

  grid.innerHTML = list.map(e => {
    const prices = (e.ticket_categories||[]).map(c=>c.price).filter(p=>p!=null);
    const minPrice = prices.length ? Math.min(...prices) : null;
    const organizerName = e.profiles?.full_name || 'Organisateur Fest&Chill';
    return `<a class="ev-card" href="festchill-buy-ticket.html?event=${e.slug}">
      <div class="ev-banner">
        <span class="ev-type-badge">${e.event_type || 'Événement'}</span>
        <span>${TYPE_ICON[e.event_type] || '🎫'}</span>
      </div>
      <div class="ev-body">
        <div class="ev-title">${e.title}</div>
        <div class="ev-meta">
          <span>📅 ${fcFormatDate(e.event_date, {day:'numeric',month:'short',year:'numeric'})}${e.event_time ? ' · ' + e.event_time : ''}</span>
          <span>📍 ${e.location || 'Lieu à confirmer'}</span>
        </div>
        <div class="ev-organizer">Par ${organizerName}</div>
        <div class="ev-footer">
          <span class="ev-price">${minPrice!=null ? 'Dès ' + minPrice.toLocaleString('fr-FR') + ' F' : 'Prix à venir'}</span>
          <span class="ev-cta">Voir →</span>
        </div>
      </div>
    </a>`;
  }).join('');
}

boot();
</script>
</body>
</html>
