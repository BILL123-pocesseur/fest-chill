<script>(function(){
  // Fest&Chill n'a plus qu'un seul thème (clair, chaud) — on force ça
  // sans dépendre d'un ancien réglage 'fc-theme' resté dans le navigateur.
  document.documentElement.setAttribute('data-theme','light');
  localStorage.setItem('fc-theme','light');
  var light=true;
  var fcLang = localStorage.getItem('fc-lang')||'fr';
  document.documentElement.lang = fcLang;
  document.documentElement.dir = (fcLang === 'ar') ? 'rtl' : 'ltr';
  var hex = localStorage.getItem('fc-accent');
  if(hex){
    function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');var n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}
    function mix(a,b,amt){return{r:Math.round(a.r+(b.r-a.r)*amt),g:Math.round(a.g+(b.g-a.g)*amt),b:Math.round(a.b+(b.b-a.b)*amt)}}
    function toHex(c){return '#'+[c.r,c.g,c.b].map(function(v){return Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')}).join('').toUpperCase()}
    var rgb=hexToRgb(hex);
    var violet=mix(rgb,{r:0,g:0,b:0},0.28);
    var glow=light?mix(rgb,{r:0,g:0,b:0},0.18):mix(rgb,{r:255,g:255,b:255},0.32);
    var s=document.documentElement.style;
    s.setProperty('--purple',hex);s.setProperty('--violet',toHex(violet));s.setProperty('--glow',toHex(glow));
    s.setProperty('--accent-rgb',rgb.r+','+rgb.g+','+rgb.b);
  }
})();
function toggleMobileSidebar(){
  document.querySelector('.sidebar').classList.toggle('open');
  document.querySelector('.sidebar-overlay').classList.toggle('show');
}
</script>
